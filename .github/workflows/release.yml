# Publishes to PyPI when a version tag (v0.1.0) is pushed. PyPI trusted publishing needs no token:
# register this repository and the workflow name `release` as a trusted publisher of the project on
# PyPI, and create a GitHub environment named `pypi`. Actions are pinned to full commit SHAs.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - run: uv sync
      - name: Check that the tag matches the package version
        run: |
          test "v$(uv version --short)" = "${GITHUB_REF_NAME}"
          test "v$(uv run python -c 'import cimrihook; print(cimrihook.__version__)')" = "${GITHUB_REF_NAME}"
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run pytest -q
      - run: uv build
      - name: Install the wheel in a clean environment and run it
        run: |
          uv venv --python 3.12 /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          cd /tmp
          test "$(/tmp/smoke/bin/cimrihook --version)" = "cimrihook ${GITHUB_REF_NAME#v}"
          /tmp/smoke/bin/cimrihook settings --mod > /dev/null
          /tmp/smoke/bin/python -c "import tempfile, pathlib; from cimrihook.mods import LAYOUT, write_mod; d = write_mod(pathlib.Path(tempfile.mkdtemp())); assert all((d / path).stat().st_size > 0 for path, _ in LAYOUT)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
