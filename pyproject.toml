[project]
name = "cimrihook"
version = "0.1.0"
description = "Context lifetime manager for Claude Code and Codex CLI: see where long sessions spend, compact at the window your own data calls for, and guard cold caches."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Senol Dogan" }]
keywords = ["claude-code", "codex", "ai-agents", "prompt-caching", "context", "llm-cost", "hooks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = []

[project.scripts]
cimrihook = "cimrihook.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cimrihook"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs/evaluation.md", "README.md", "LICENSE", "pyproject.toml"]

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.13", "ruff>=0.8"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
